<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebTool</title>
    <script>
      // 在页面渲染前设置主题,避免深色用户先看到一闪而过的白屏
      (function () {
        var m = localStorage.getItem('webtool.theme') || 'auto'
        var dark = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light')
        if (dark) document.documentElement.classList.add('jse-theme-dark')
      })()
    </script>
    <style>
      html, body { margin: 0; }
      .boot { box-sizing: border-box; }
      html[data-bs-theme='dark'] body { background: #212529; }
      .boot { display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100vh; gap: 12px; color: #6c757d; font: 14px system-ui, sans-serif; }
      .boot i { width: 36px; height: 36px; border: 3px solid #dee2e6; border-top-color: #0d6efd;
        border-radius: 50%; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"><div class="boot"><i></i>加载中...</div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
